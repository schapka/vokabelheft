name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Pull requests that change nothing but lesson files (data/lessons/*.json)
  # are merged automatically once the checks pass, whatever the branch is called.
  merge-lesson:
    needs: check
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Is this a lesson-only change?
        id: scope
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "$changed"
          outside=$(echo "$changed" | grep -Ev '^data/lessons/[^/]+\.json$' || true)
          if [ -z "$changed" ] || [ -n "$outside" ]; then
            echo "Not a lesson-only PR — leaving it for a human to merge."
            echo "lesson_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "lesson_only=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Merge
        if: steps.scope.outputs.lesson_only == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "${{ github.event.pull_request.number }}" --squash --delete-branch
    outputs:
      lesson_only: ${{ steps.scope.outputs.lesson_only }}

  # A merge made with GITHUB_TOKEN does not trigger the push workflow,
  # so the deploy is chained here.
  deploy-lesson:
    needs: merge-lesson
    if: needs.merge-lesson.outputs.lesson_only == 'true'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
